version: 1
project: Ianropke/cph-housing-model
owner: Ian Røpke
currency: DKK
policy: Ianropke/code-portfolio/RESOURCE_BUDGET_POLICY.md
canonical_portfolio_register: Ianropke/code-portfolio/PORTFOLIO_BUDGETS.yaml

approval:
  status: pending_owner_approval
  approved_by: null
  approved_at: null

cash_budget:
  recurring_monthly_dkk: null
  one_off_dkk: null

quota_budgets:
  github_actions_execution_month: null
  vercel_build_runtime_bandwidth: null
  external_source_requests_rate_limits: null

current_resources:
  - provider: GitHub Actions
    purpose: daily model/data refresh, validation and generated-data publication
    cost_driver: runner_execution_and_schedule_frequency
    criticality: high
  - provider: Vercel
    purpose: static dashboard hosting
    cost_driver: builds_bandwidth
    criticality: medium
  - provider: External public data sources
    purpose: housing and macro data acquisition
    cost_driver: requests_and_rate_limits
    criticality: high

pending_policy:
  existing_configuration_may_continue: true
  allow_new_paid_services: false
  allow_paid_overage: false
  allow_plan_upgrades: false
  allow_schedule_frequency_increase: false
  allow_compute_or_storage_scale_up: false

guardrails:
  warning_threshold_percent: 70
  constrained_threshold_percent: 90
  hard_ceiling_percent: 100
  require_cost_and_quota_estimate_before_resource_change: true
  require_cheaper_alternatives_review: true
  require_owner_approval_if_projected_ceiling_exceeded: true

agent_rule: >-
  Read this file before changing CI, data-refresh cadence, hosting, data sources,
  model execution, retention, or any other metered resource. Do not create or
  expand cost/quota exposure while approval is pending.
