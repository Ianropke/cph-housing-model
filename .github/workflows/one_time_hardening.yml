name: One-time repository hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply security and terminology fixes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          server = Path('server/cph_housing_server.py')
          text = server.read_text(encoding='utf-8')

          old = '''# Create unverified SSL context to avoid certificate verification errors on macOS\nssl_context = ssl._create_unverified_context()'''
          new = '''# Use the platform's normal certificate validation. Never disable TLS verification\n# for externally sourced economic data.\nssl_context = ssl.create_default_context()'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'ssl._create_unverified_context' in text:
              raise SystemExit('Unexpected unverified SSL usage remains; refusing an unsafe partial rewrite.')
          server.write_text(text, encoding='utf-8')

          # Rename the risk-index terminology without changing the numeric algorithm.
          replacements = {
              'Max Risk Probability Index': 'Market Risk Score',
              'Max Risk Probability': 'Market Risk Score',
          }
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == server:
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = content
              for old_term, new_term in replacements.items():
                  updated = updated.replace(old_term, new_term)
              if updated != content:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify hardening
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --exclude-dir=.git -n '_create_unverified_context\|verify=False' .; then
            echo 'Unsafe TLS verification bypass remains.'
            exit 1
          fi
          if grep -R --exclude-dir=.git -n 'Max Risk Probability Index\|Max Risk Probability' .; then
            echo 'Deprecated probability terminology remains.'
            exit 1
          fi
          python -m compileall -q server scripts tests

      - name: Commit fixes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one_time_hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'security: enforce TLS verification and clarify risk score semantics'
            git push
          fi
