name: Final model hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply final semantic and security fixes
        shell: python
        run: |
          from pathlib import Path

          server = Path('server/cph_housing_server.py')
          text = server.read_text(encoding='utf-8')
          text = text.replace('ssl_context = ssl._create_unverified_context()', 'ssl_context = ssl.create_default_context()')
          text = text.replace('Max Risk Probability Index', 'Market Risk Score')
          text = text.replace('Max Risk Probability', 'Market Risk Score')
          text = text.replace('probability_weight', 'ensemble_weight')

          start = text.find('@mcp.tool()\ndef get_historical_ml_probabilities(')
          end = text.find('# ─────────────────────────────────────────────────────────────\n# TOOL 4: run_forecast_ensemble', start)
          if start >= 0 and end > start:
              replacement = '''@mcp.tool()\ndef get_historical_ml_probabilities(\n    segment: str = "copenhagen_apartments",\n    ewi1_mode: str = "yoy_expanded",\n    limit: int = 4,\n    dst_data: Optional[dict] = None\n) -> list:\n    """Return only genuine archived out-of-sample probability observations."""\n    return []\n\n'''
              text = text[:start] + replacement + text[end:]

          start = text.find('@mcp.tool()\ndef run_historical_backtest(')
          end = text.find('# ─────────────────────────────────────────────────────────────\n# SERVER ENTRY POINT', start)
          if start >= 0 and end > start:
              replacement = '''@mcp.tool()\ndef run_historical_backtest(start_year: int = 2000, end_year: int = 2026) -> dict:\n    """Run the transparent walk-forward event benchmark."""\n    import sys\n    from pathlib import Path\n    scripts_dir = str(Path(__file__).resolve().parent.parent / "scripts")\n    if scripts_dir not in sys.path:\n        sys.path.insert(0, scripts_dir)\n    from evaluate_event_prediction import evaluate_crash_event_prediction\n    return evaluate_crash_event_prediction()\n\n\n'''
              text = text[:start] + replacement + text[end:]

          server.write_text(text, encoding='utf-8')

          scenarios = Path('config/scenarios.yaml')
          scenarios.write_text(
              scenarios.read_text(encoding='utf-8').replace('probability_weight:', 'ensemble_weight:'),
              encoding='utf-8',
          )

      - name: Verify repository semantics
        env:
          PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          ! grep -R --exclude-dir=.git --exclude='final_model_hardening.yml' -n '_create_unverified_context\|verify=False' .
          ! grep -R --exclude-dir=.git --exclude='final_model_hardening.yml' -n 'Max Risk Probability Index\|Max Risk Probability' .
          ! grep -R --exclude-dir=.git --exclude='final_model_hardening.yml' -n 'probability_weight:' config server scripts dashboard/src
          python -m compileall -q server scripts tests
          python scripts/evaluate_event_prediction.py --output reports/event_backtest_latest.json

      - name: Run event tests
        env:
          PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/scripts
        run: python -m unittest tests/test_event_backtest.py

      - name: Commit and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/final_model_hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'model: finalize walk-forward validation and production semantics' || true
          git push
